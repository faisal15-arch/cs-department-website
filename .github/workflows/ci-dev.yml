name: CI - Development

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  lint-html:
    name: Lint HTML Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install HTMLHint
        run: npm install -g htmlhint

      - name: Run HTML Linting
        run: htmlhint "*.html"

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: lint-html

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t cs-dept-website:dev .

      - name: Test container starts
        run: |
          docker run -d -p 8080:80 --name test-container cs-dept-website:dev
          sleep 5
          curl -f http://localhost:8080 || exit 1
          docker stop test-container