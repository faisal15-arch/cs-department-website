name: CD - Deploy to Staging

on:
  push:
    branches: [ release ]

jobs:
  deploy-staging:
    name: Deploy to Netlify (Staging)
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Trigger Netlify Build (Staging)
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_STAGING }}"
          echo "Staging deployment triggered!"