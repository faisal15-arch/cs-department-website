name: CD - Deploy to Development

on:
  push:
    branches: [ develop ]

jobs:
  deploy-development:
    name: Deploy to Render (Development)
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Trigger Render Deploy (Development)
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_DEV }}"
          echo "Development deployment triggered!"